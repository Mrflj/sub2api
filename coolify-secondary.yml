services:
  sub2api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8999:8080"
    volumes:
      - sub2api_data:/app/data
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  sub2api-network:
    external: true
    name: deploy_sub2api-network

volumes:
  sub2api_data:
    external: true
    name: deploy_sub2api_data

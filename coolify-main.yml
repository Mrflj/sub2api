services:
  sub2api:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      AUTO_SETUP: "false"
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "8898"
      SERVER_MODE: "release"
    volumes:
      - /opt/sub2api-docker-migration/backup-20261114-225158/candidate-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8898/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s  
